<div class="register-wrapper">
  <div class="glass-panel register-card">
    <div class="logo-area">
      <div class="logo-icon">💬</div>
      <h1 class="app-title">UChat</h1>
      <p class="subtitle">Join our secure network</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-container">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required 
            placeholder="Choose username" 
            class="form-input" 
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            placeholder="Create password" 
            class="form-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-container">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            required 
            placeholder="Confirm password" 
            class="form-input"
          />
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="success-banner">
        <span class="success-icon">✓</span>
        <span class="success-text">{{ successMessage }}</span>
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="form-footer">
        <span>Already have an account? </span>
        <a (click)="goToLogin()" class="interactive-link">Sign In</a>
      </div>
    </form>
  </div>
</div>
